[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpal"
version = "0.3.0"
description = "A simple terminal-based Git and GitHub assistant built with Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7",
]

[project.scripts]
gitpal = "main:main"