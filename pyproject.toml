[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitbuddy"
version = "0.2.0"
description = "A simple terminal-based Git and GitHub assistant built with Python"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
gitbuddy = "main:main"